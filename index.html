<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juan Esteban Duque — Portafolio</title>
  <meta name="description" content="Desarrollador fullstack y diseñador de interfaces. Del Figma al producto en producción.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abel&family=National+Park&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body
  x-data="{
    lang: localStorage.getItem('lang') || (navigator.language.startsWith('es') ? 'es' : 'en'),
    get t() { return i18n[this.lang] },
  }"
  x-effect="document.documentElement.lang = lang; localStorage.setItem('lang', lang)"
>
  <header class="header">
    <a class="logo" href="#top" aria-label="JEDT"><img src="assets/logo.svg" alt="" width="89" height="16"></a>
    <nav class="nav">
      <template x-for="(label, i) in t.nav" :key="i">
        <a :href="'#' + ['projects', 'experience', 'explorations', 'about', 'contact'][i]" x-text="label"></a>
      </template>
    </nav>
    <div class="lang-switch">
      <button type="button" :aria-pressed="lang === 'es'" @click="lang = 'es'">ES</button>
      <button type="button" :aria-pressed="lang === 'en'" @click="lang = 'en'">EN</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="orb orb-hero" aria-hidden="true"></div>
      <p class="status"><span class="dot"></span><span x-text="t.available"></span></p>
      <h1><span x-text="t.h1"></span><span class="accent" x-text="t.h1Accent"></span></h1>
      <p class="lead" x-text="t.lead"></p>
      <ul class="tags">
        <li>React</li><li>TypeScript</li><li>Next.js</li><li>NestJS</li><li>Spring Boot</li><li>Figma</li>
      </ul>
      <div class="actions">
        <a class="btn btn-primary" href="#projects" x-text="t.viewProjects"></a>
        <a class="btn" href="#contact" x-text="t.contact"></a>
      </div>
      <div class="badge" aria-hidden="true"><span>UI / UX</span><hr><span>FULLSTACK DEV</span></div>
    </section>

    <section id="projects" class="section">
      <div class="section-heading">
        <p class="eyebrow" x-text="t.projectsEyebrow"></p>
        <h2 x-text="t.projectsTitle"></h2>
      </div>

      <article class="project">
        <div class="preview preview-solar" aria-hidden="true">
          <div class="browser-bar"><i></i><i></i><i></i></div>
          <div class="mock">
            <p class="mock-title" x-text="t.p1MockTitle"></p>
            <div class="mock-pills"><i></i><i></i><i></i></div>
            <div class="mock-sun"></div>
            <span class="mock-cta" x-text="t.p1MockCta"></span>
          </div>
        </div>
        <div class="project-info">
          <p class="eyebrow plain">01</p>
          <h3 x-text="t.p1Title"></h3>
          <p class="muted" x-text="t.p1Text"></p>
          <ul class="tags"><li>Web app</li><li>WhatsApp</li><li>UX/UI</li></ul>
          <a class="text-link" :href="links.case1"><span x-text="t.viewCase"></span> ↗&#xFE0E;</a>
        </div>
      </article>

      <article class="project project-reverse">
        <div class="preview preview-chat" aria-hidden="true">
          <div class="browser-bar"><i></i><i></i><i></i></div>
          <div class="mock mock-chat">
            <p class="chat-title" x-text="t.p2MockTitle"></p>
            <span class="bubble bubble-user" x-text="t.p2MockQuestion"></span>
            <span class="bubble bubble-bot" x-text="t.p2MockAnswer"></span>
            <span class="chat-input" x-text="t.p2MockInput"></span>
          </div>
        </div>
        <div class="project-info">
          <p class="eyebrow plain">02</p>
          <h3 x-text="t.p2Title"></h3>
          <p class="muted" x-text="t.p2Text"></p>
          <ul class="tags"><li>n8n</li><li>Supabase</li><li>AI</li></ul>
          <a class="text-link" :href="links.case2"><span x-text="t.viewCase"></span> ↗&#xFE0E;</a>
        </div>
      </article>
    </section>

    <section id="experience" class="section">
      <div class="section-heading">
        <p class="eyebrow" x-text="t.expEyebrow"></p>
        <h2 x-text="t.expTitle"></h2>
      </div>
      <template x-for="job in t.jobs" :key="job.company">
        <article class="job">
          <p class="eyebrow plain soft" x-text="job.date"></p>
          <div>
            <h3 x-text="job.company"></h3>
            <p class="role" x-text="job.role"></p>
            <p x-text="job.text"></p>
          </div>
        </article>
      </template>
    </section>

    <section id="explorations" class="section">
      <div class="section-heading">
        <p class="eyebrow" x-text="t.exploreEyebrow"></p>
        <h2 x-text="t.exploreTitle"></h2>
      </div>
      <div class="explorations">
        <template x-for="(item, i) in t.explorations" :key="i">
          <article class="exploration" :class="'exploration-' + i">
            <div class="exploration-cover" aria-hidden="true"><span x-text="['DDD', 'UX', 'UI'][i]"></span></div>
            <div class="exploration-body">
              <h3 x-text="item.title"></h3>
              <p class="muted" x-text="item.text"></p>
              <a class="text-link" :href="links.explorations[i]"><span x-text="item.link"></span> ↗&#xFE0E;</a>
            </div>
          </article>
        </template>
      </div>
    </section>

    <section id="about" class="section about">
      <img class="about-photo" src="assets/foto-perfil.webp" :alt="t.photoAlt" width="420" height="525" loading="lazy">
      <div>
        <p class="eyebrow" x-text="t.aboutEyebrow"></p>
        <h2 x-text="t.aboutTitle"></h2>
        <p class="about-text" x-text="t.aboutText"></p>
      </div>
    </section>

    <section id="contact" class="section contact">
      <div class="orb orb-contact" aria-hidden="true"></div>
      <p class="eyebrow" x-text="t.contactEyebrow"></p>
      <div class="contact-cta">
        <h2 x-text="t.contactTitle"></h2>
        <a class="btn btn-primary" :href="links.email" x-text="t.writeMe"></a>
      </div>
      <div class="contact-links">
        <a class="text-link" :href="links.email"><span x-text="t.email"></span> ↗&#xFE0E;</a>
        <a class="text-link" :href="links.linkedin">LinkedIn ↗&#xFE0E;</a>
        <a class="text-link" :href="links.github">GitHub ↗&#xFE0E;</a>
        <a class="btn" :href="links.cv" x-text="t.downloadCv"></a>
      </div>
      <footer class="footer">
        <span>JE·DT — Juan Esteban Duque</span>
        <span>Cali, Colombia · 2026</span>
      </footer>
    </section>
  </main>
</body>
</html>
